{% include 'base.html' %}
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收支流水统计</title>
    <style>
        .table th,
        .table td {
            vertical-align: middle;
            text-align: center;
            padding: 10px;
        }

        .table-container {
            max-height: calc(100vh - 280px);
            overflow-y: auto;
        }

        .input-group-text {
            min-width: 100px;
            text-align: center;
        }
    </style>
</head>
<!-- 修改：为 body 添加 d-flex 和 flex-column 类，并移除默认边距 -->

<body class="d-flex flex-column m-0 p-0" style="height: 100vh;">

    <div class="container-fluid flex-grow-1 d-flex flex-column">
        <div class="card flex-grow-1">
            <!-- 卡片标题 -->
            <div class="card-header bg-primary text-white text-center">
                <h5 class="card-title mb-0">记录/查看流水</h5>
            </div>
            <div class="card-body d-flex flex-column flex-grow-1 p-4">
                <form id="flowForm" class="row g-3 mb-4"> <!-- 添加 mb-4 与表格保持一点距离 -->
                    <div class="col-md-3">
                        <div class="input-group">
                            <span class="input-group-text">收支时间</span>
                            <input type="datetime-local" id="DATE" name="DATE" class="form-control" required>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="input-group">
                            <span class="input-group-text">收支价格</span>
                            <input type="number" id="price" name="price" class="form-control" step="0.01" required>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="input-group">
                            <span class="input-group-text">收支人</span>
                            <input type="text" id="person" name="person" class="form-control" value="swx" disabled>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="input-group">
                            <span class="input-group-text">备注信息</span>
                            <select id="msg" name="msg" class="form-select" required>
                                <option value="日常开销" selected>日常开销</option>
                                <option value="工资收入">工资收入</option>
                                <option value="交通出行">交通出行</option>
                                <option value="购物消费">购物消费</option>
                                <option value="房租水电">房租水电</option>
                                <option value="娱乐休闲">娱乐休闲</option>
                                <option value="医疗健康">医疗健康</option>
                                <option value="学习教育">学习教育</option>
                                <option value="人情往来">人情往来</option>
                                <option value="其他支出">其他支出</option>
                                <option value="其他收入">其他收入</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-primary btn-lg px-5">确定提交</button>
                    </div>
                </form>

                <hr class="my-2">

                <!-- 流水表格区域：将占满剩余空间 -->
                <div class="table-container flex-grow-1">
                    <table class="table table-striped table-hover table-bordered mb-0"> <!-- 移除表格底部边距 -->
                        <thead class="table-light sticky-top">
                            <tr>
                                <th>ID</th>
                                <th>收支时间</th>
                                <th>简明时间</th>
                                <th>收支人</th>
                                <th>流水金额</th>
                                <th>备注信息</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% if res and res|length > 0 %}
                            {% for item in res %}
                            <tr>
                                <td>{{ item[0] }}</td>
                                <td>{{ item[1] }}</td>
                                <td>{{ item[2] }}</td>
                                <td>{{ item[3] }}</td>
                                <!-- 格式化金额：补前导零，保留2位小数 -->
                                <td>{{ "%.2f"|format(item[4]|float) }}</td>
                                <td>{{ item[5] or '-' }}</td>
                            </tr>
                            {% endfor %}
                            {% else %}
                            <tr>
                                <td colspan="6" class="text-center text-muted">暂无流水记录</td>
                            </tr>
                            {% endif %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 格式化日期时间：补前导零（核心解决前导零问题）
        function padZero(num) {
            return num < 10 ? '0' + num : num;
        }

        // 2. 设置默认日期时间（使用datetime-local类型，兼容浏览器）
        $(document).ready(function () {
            const today = new Date();
            const year = today.getFullYear();
            const month = padZero(today.getMonth() + 1);
            const day = padZero(today.getDate());
            const hours = padZero(today.getHours());
            const mins = padZero(today.getMinutes());

            // datetime-local格式：YYYY-MM-DDTHH:MM
            const defaultDatetime = `${year}-${month}-${day}T${hours}:${mins}`;
            $('#DATE').val(defaultDatetime);
        });

        // 3. 表单提交处理
        $('#flowForm').submit(function (e) {
            e.preventDefault(); // 阻止默认提交

            // 表单验证
            if (!this.checkValidity()) {
                e.stopPropagation();
                $(this).addClass('was-validated');
                return false;
            }

            // 收集表单数据
            const requestData = {
                date: $('#DATE').val().replace('T', ' '), // 转换为后端需要的格式（YYYY-MM-DD HH:MM）
                price: parseFloat($('#price').val()),
                person: $('#person').val(),
                msg: $('#msg').val().trim()
            };

            // AJAX提交
            $.ajax({
                url: '/flow',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(requestData),
                success: function (response) {
                    if (response.status === 'success') {
                        // 使用Bootstrap Toast提示成功
                        showToast('提交成功', '流水记录已保存', 'success');
                        setTimeout(() => location.reload(), 1500); // 1.5秒后刷新
                    } else {
                        showToast('提交失败', '请稍后重试', 'danger');
                    }
                },
                error: function () {
                    showToast('网络错误', '无法连接服务器', 'danger');
                }
            });
        });
    </script>
</body>

</html>
